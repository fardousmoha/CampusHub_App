<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusHub · Phase 1 code</title>
<style>
:root{
  --navy:#1F3A5F; --navy-2:#2B4C78; --ink:#1A2230; --muted:#5E6A7B; --page:#EEF2F7; --surface:#FFFFFF; --line:#D9E0EA;
  --soft:#E6EDF7; --done:#2E7D32; --done-soft:#E3F2E5; --on-navy:#FFFFFF;
  --ed-bg:#1F232A; --ed-gutter:#1B1F25; --ed-tab:#262B33; --ed-line:#2F3540; --ed-ink:#C9D1DC; --ed-num:#4E5662;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#9CBBE8; --navy-2:#B6CDF0; --ink:#E5EAF1; --muted:#9AA5B5; --page:#0F141C; --surface:#161D28; --line:#283244;
    --soft:#1D2838; --done:#7CC98B; --done-soft:#17281D; --on-navy:#0D1520;
    --ed-bg:#12161C; --ed-gutter:#0F1318; --ed-tab:#1A1F27; --ed-line:#232A35; --ed-ink:#C9D1DC; --ed-num:#465060;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#9CBBE8; --navy-2:#B6CDF0; --ink:#E5EAF1; --muted:#9AA5B5; --page:#0F141C; --surface:#161D28; --line:#283244;
  --soft:#1D2838; --done:#7CC98B; --done-soft:#17281D; --on-navy:#0D1520;
  --ed-bg:#12161C; --ed-gutter:#0F1318; --ed-tab:#1A1F27; --ed-line:#232A35; --ed-ink:#C9D1DC; --ed-num:#465060;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{min-height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
.mono,code,pre{font-family:"Cascadia Code","JetBrains Mono",Consolas,"SF Mono",Menlo,"Courier New",monospace}
p code,li code,td code{font-size:.86em;background:var(--soft);padding:1px 6px;border-radius:5px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:6px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:var(--navy);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{font-size:1.02rem;white-space:nowrap}
.brand span{color:var(--muted);font-size:.9rem;white-space:nowrap}
.progress{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.meter{width:220px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--done);border-radius:99px;transition:width .35s ease}
.count{font-size:.9rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer}

/* Layout */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - 64px)}
aside{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);height:calc(100vh - 64px);overflow:auto;padding:16px 10px 40px}
.side-label{font-size:.8rem;font-weight:600;color:var(--muted);padding:14px 12px 6px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:.93rem}
.item:hover{background:var(--soft)}
.item[aria-current="page"]{background:var(--navy);color:var(--on-navy)}
.item[aria-current="page"] .badge{border-color:var(--on-navy);color:var(--on-navy)}
.badge{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--muted)}
.is-done .badge{background:var(--done);border-color:var(--done);color:#fff}
.item[aria-current="page"].is-done .badge{background:var(--done);border-color:var(--done);color:#fff}
.folder{display:flex;align-items:center;gap:8px;padding:5px 12px;color:var(--muted);font-size:.88rem}
.folder svg{width:16px;height:16px;flex:none}
.indent-1{padding-left:28px}.indent-2{padding-left:44px}.indent-3{padding-left:60px}
.item .fname{font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{padding:32px clamp(18px,4vw,48px) 80px;max-width:1100px;width:100%}
.crumb{font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;font-size:.85rem;color:var(--muted);margin-bottom:6px;overflow-wrap:anywhere}
h1{font-size:clamp(1.6rem,2.6vw,2.1rem);line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:68ch;margin:0 0 20px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:.92rem;font-weight:600}
.btn:hover{border-color:var(--navy)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.ok{background:var(--done);border-color:var(--done);color:#fff}

/* Editor */
.editor{border-radius:14px;overflow:hidden;background:var(--ed-bg);box-shadow:0 12px 30px -18px rgba(15,25,45,.55)}
.tabs{display:flex;align-items:center;background:var(--ed-tab);border-bottom:1px solid var(--ed-line);padding:0 8px 0 0}
.tab{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--ed-bg);color:#E6EBF2;font-size:.84rem;border-right:1px solid var(--ed-line)}
.tab .dart{width:10px;height:10px;border-radius:2px;background:#41B6E6;transform:rotate(45deg)}
.tabs .spacer{flex:1}
.tabs .mini{border:1px solid #3A4250;background:transparent;color:#C9D1DC;border-radius:8px;padding:5px 12px;font-size:.8rem;cursor:pointer}
.tabs .mini:hover{border-color:#8AA5CC}
.tabs .mini.ok{background:var(--done);border-color:var(--done);color:#fff}
.code{display:grid;grid-template-columns:auto 1fr;max-height:min(68vh,760px);overflow:auto;font-size:.86rem;line-height:1.6}
.gutter{background:var(--ed-gutter);color:var(--ed-num);text-align:right;padding:14px 12px 14px 16px;user-select:none;position:sticky;left:0}
.lines{padding:14px 20px;color:var(--ed-ink);white-space:pre;tab-size:2}
.gutter div,.lines div{min-height:1.6em}
.lines .k{color:#C678DD}.lines .t{color:#E5C07B}.lines .s{color:#98C379}.lines .n{color:#D19A66}
.lines .c{color:#7F848E;font-style:italic}.lines .f{color:#61AFEF}.lines .d{color:#56B6C2}

.done-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.check{display:flex;align-items:center;gap:12px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--done)}
.nav{display:flex;gap:10px}

/* Content pages */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:0 0 18px}
.panel h2{font-size:1.1rem;margin:0 0 10px}
.steps{margin:0;padding-left:22px}.steps li{margin:6px 0}
.term{background:var(--ed-bg);color:#E6EBF2;border-radius:12px;padding:14px 18px;overflow-x:auto;margin:12px 0 0;font-size:.88rem;line-height:1.7}
.term .p{color:#7CC98B;user-select:none}
.tree{font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;font-size:.85rem;line-height:1.55;white-space:pre;overflow-x:auto;margin:0;color:var(--ink)}
.note{border-left:4px solid var(--navy);background:var(--soft);padding:12px 16px;border-radius:0 10px 10px 0;max-width:72ch}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600}
.tbl-wrap{overflow-x:auto}
td.cb{width:46px}td.cb input{width:20px;height:20px;accent-color:var(--done)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 64px) auto 0 0;width:min(320px,86vw);height:auto;z-index:9;transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.menu-open aside{transform:none}
  .menu-btn{display:inline-block}
  .meter{width:70px}
  .brand span{display:none}
  .top{gap:10px;padding:0 12px}
  main{padding:24px 16px 60px}
}
@media (max-width:420px){ .brand b{display:none} .meter{display:none} }
@media (prefers-reduced-motion: reduce){.meter i,aside{transition:none}}
</style>
</head>

ired<\/span> <span class=\"k\">this<\/span>.facultyId,", "  });", "}"]}, {"n": 5, "path": "lib/models/student.dart", "name": "student.dart", "title": "Student model", "note": "The <code>students<\/code> table: which class each student belongs to.", "code": "// lib/models/student.dart\nclass Student {\n  final int id;\n  final int userId;    // the login account (foreign key to users)\n  final int classId;   // the class of the student (foreign key to classes)\n\n  const Student({required this.id, required this.userId, required this.classId});\n}\n", "hl": ["<span class=\"c\">// lib/models/student.dart<\/span>", "<span class=\"k\">class<\/span> <span class=\"t\">Student<\/span> {", "  <span class=\"k\">final<\/span> <span class=\"t\">int<\/span> id;", "  <span class=\"k\">final<\/span> <span class=\"t\">int<\/span> userId;    <span class=\"c\">// the login account (foreign key to users)<\/span>", "  <span class=\"k\">final<\/span> <span class=\"t\">int<\/span> classId;   <span class=\"c\">// the class of the student (foreign key to classes)<\/span>", "", "  <span class=\"k\">const<\/span> <span class=\"t\">Student<\/span>({<span class=\"k\">required<\/span> <span class=\"k\">this<\/span>.id, <span class=\"k\">required<\/span> <span class=\"k\">this<\/span>.userId, <span class=\"k\">required<\/span> <span class=\"k\">this<\/span>.classId});", "}"]}, {"n": 6, "path": "lib/data/sample_data.dart", "name": "sample_data.dart", "title": "Sample data", "note": "The same rows as the database example, plus small functions that work like database queries: <code>checkLogin()<\/code> and <code>classOfStudent()<\/code>.", "code": "// lib/data/sample_data.dart\nimport '../models/user.dart';\nimport '../models/faculty.dart';\nimport '../models/school_class.dart';\nimport '../models/student.dart';\n\n// ===== The \"tables\" =====\n\nconst sampleUsers = [\n  User(id: 1, universityId: 'ADM01', fullName: 'Amina Hassan', password: '1234', role: Role.admin),\n  User(id: 2, universityId: 'LEC10', fullName: 'Ibrahim Ahmed', password: '1234', role: Role.lecturer),\n  User(id: 3, universityId: '20240153', fullName: 'Hodan Ali', password: '1234', role: Role.student),\n  User(id: 4, universityId: 'LEC12', fullName: 'Abdirahman Yusuf', password: '1234', role: Role.lecturer),\n];\n\nconst sampleFaculties = [\n  Faculty(id: 1, name: 'Faculty of Computer Science'),\n];\n\nconst sampleClasses = [\n  SchoolClass(id: 1, name: 'CS-7A', semester: 7, facultyId: 1),\n];\n\nconst sampleStudents = [\n  Student(id: 1, userId: 3, classId: 1),\n];\n\n// ===== Finding data, like a database query =====\n\n// Check the ID and password. Returns the user, or null if they are wrong.\nUser? checkLogin(String universityId, String password) {\n  for (final user in sampleUsers) {\n    if (user.universityId == universityId && user.password == password) {\n      return user;\n    }\n  }\n  return null;\n}\n\nFaculty findFaculty(int id) => sampleFaculties.firstWhere((f) => f.id == id);\n\nSchoolClass findClass(int id) => sampleClasses.firstWhere((c) => c.id == id);\n\n// The class of a student. Returns null for staff, who have no class.\nSchoolClass? classOfStudent(int userId) {\n  for (final student in sampleStudents) {\n    if (student.userId == userId) return findClass(student.classId);\n  }\n  return null;\n}\n", "hl": ["<span class=\"c\">// lib/data/sample_data.dart<\/span>", "<span class=\"k\">import<\/span> <span class=\"s\">&#x27;<\/span><span class=\"s\">../models/user.dart<\/span><span class=\"s\">&#x27;<\/span>;", "<span class=\"k\">import<\/span> <span class=\"s\">&#x27;<\/span><span class=\"s\">../models/faculty.dart<\/span><span class=\"s\">&#x27;<\/span>;", "<span class=\"k\">import<\/span> <span class=\"s\">&#x27;<\/span><span class=\"s\">../models/school_class.dart<\/span><span class=\"s\">&#x27;<\/span>;", "<span class=\"k\">import<\/span> <span class=\"s\">&#x27;<\/span><span class=\"s\">../models/student.dart<\/span><span class=\"s\">&#x27;<\/span>;", "", "<span c .dart';\nimport '../models/user.dart';\nimport '../theme/app_theme.dart';\nimport 'login_screen.dart';\n\nclass ProfileScreen extends StatelessWidget {\n  final User user;\n  const ProfileScreen({super.key, required this.user});\n\n  Future<void> _logout(BuildContext context) async {\n    final confirmed = await showDialog<bool>(\n      context: context,\n      builder: (context) => AlertDialog(\n        title: const Text('Log out'),\n        content: const Text('Do you want to log out?'),\n        actions: [\n          TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('Cancel')),\n          TextButton(onPressed: () => Navigator.pop(context, true), child: const Text('Log out')),\n        ],\n      ),\n    );\n\n    if (confirmed != true || !context.mounted) return;\n\n    // Go back to Login and remove every other screen\n    Navigator.pushAndRemoveUntil(\n      context,\n      MaterialPageRoute(builder: (context) => const LoginScreen()),\n      (route) => false,\n    );\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    final schoolClass = classOfStudent(user.id);   // null for staff\n\n    return Scaffold(\n      appBar: AppBar(title: const Text('Profile')),\n      body: ListView(\n        padding: const EdgeInsets.all(16),\n        children: [\n          const SizedBox(height: 8),\n          Center(\n            child: CircleAvatar(\n              radius: 42,\n              backgroundColor: AppTheme.highlight,\n              child: Text(\n                user.fullName[0],\n                style: const TextStyle(fontSize: 34, fontWeight: FontWeight.bold, color: AppTheme.primary),\n              ),\n            ),\n          ),\n          const SizedBox(height: 12),\n          Text(\n            user.fullName,\n            textAlign: TextAlign.center,\n            style: Theme.of(context).textTheme.titleLarge?.copyWith(fontWeight: FontWeight.bold),\n          ),\n          const SizedBox(height: 8),\n          Center(child: t) {\n    ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(text)));\n  }\n\n  void _login() {\n    final id = _idController.text.trim();\n    final password = _passwordController.text;\n\n    if (id.isEmpty || password.isEmpty) {\n      _showMessage('Please enter your ID and password');\n      return;\n    }\n\n    final user = checkLogin(id, password);\n    if (user == null) {\n      _showMessage('Wrong ID or password');\n      return;\n    }\n\n    // The role decides the first screen\n    final Widget home = switch (user.role) {\n      Role.student => StudentShell(user: user),\n      Role.lecturer => LecturerShell(user: user),\n      Role.admin => AdminShell(user: user),\n    };\n\n    Navigator.pushReplacement(context, MaterialPageRoute(builder: (context) => home));\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      backgroundColor: Colors.white,\n      body: SafeArea(\n        child: Center(\n          child: SingleChildScrollView(\n            padding: const EdgeInsets.all(24),\n            child: Column(\n              crossAxisAlignment: CrossAxisAlignment.stretch,\n              children: [\n                const AppLogo(),\n                const SizedBox(height: 24),\n                Text(\n                  'Welcome to CampusHub',\n                  textAlign: TextAlign.center,\n                  style: Theme.of(context).textTheme.headlineSmall?.copyWith(fontWeight: FontWeight.bold),\n                ),\n                const SizedBox(height: 8),\n                const Text(\n                  'Log in with your university ID',\n                  textAlign: TextAlign.center,\n                  style: TextStyle(color: Colors.grey),\n                ),\n                const SizedBox(height: 32),\n                TextField(\n                  controller: _idController,\n                  decoration: const InputDecoration(\n                    labelText: 'Student or staff ID',\n                    prefixI function folder(name, indent){ return `<div class="folder indent-${indent}">${ICON_FOLDER}${name}</div>`; }

  h += folder('models', 1) + [2,3,4,5].map(n => fileItem(n, 2)).join('');
  h += folder('data', 1) + fileItem(6, 2);
  h += folder('widgets', 1) + [7,8].map(n => fileItem(n, 2)).join('');
  h += folder('screens', 1) + [9,10,14,15].map(n => fileItem(n, 2)).join('');
  h += folder('student', 2) + fileItem(11, 3);
  h += folder('lecturer', 2) + fileItem(12, 3);
  h += folder('admin', 2) + fileItem(13, 3);
  h += fileItem(16, 1);
  h += '<div class="side-label">Finish</div>';
  h += '<button class="item" data-go="test"><span class="badge">✓</span>Run and test</button>';
  side.innerHTML = h;
}

function filePage(n){
  const f = FILES[n-1];
  const nums = f.hl.map((_, i) => `<div>${i+1}</div>`).join('');
  const lines = f.hl.map(l => `<div>${l || ' '}</div>`).join('');
  const prev = n > 1 ? `<button class="btn" data-go="f${n-1}">Previous</button>` : `<button class="btn" data-go="start">Previous</button>`;
  const next = n < FILES.length ? `<button class="btn primary" data-go="f${n+1}">Next file</button>` : `<button class="btn primary" data-go="test">Run and test</button>`;
  return `
  <div class="crumb">File ${n} of ${FILES.length} · ${f.path}</div>
  <h1>${f.title}</h1>
  <p class="lead">${f.note}</p>
  <div class="actions">
    <button class="btn" data-copypath="${n}">${ICON_COPY}Copy path</button>
    <button class="btn primary" data-copycode="${n}">${ICON_COPY}Copy code</button>
  </div>
  <div class="editor">
    <div class="tabs"><div class="tab"><span class="dart"></span>${f.name}</div><span class="spacer"></span><button class="mini" data-copycode="${n}">Copy</button></div>
    <div class="code"><div class="gutter mono">${nums}</div><div class="lines mono">${lines}</div></div>
  </div>
  <div class="done-row">
    <label class="check"><input type="checkbox" data-done="f${n}" ${state['f'+n] ? 'checked' : ''}> I created this file</label>
    <div class="nav">${prev}${next}</div>
  </div>`;
}

function show(id){
  if (!id || !(id === 'start' || id === 'test' || /^f\d+$/.test(id))) id = 'start';
  if (id.startsWith('f')) { const n = +id.slice(1); if (n < 1 || n > FILES.length) id = 'start'; }
  main.innerHTML = id === 'start' ? startPage() : id === 'test' ? testPage() : filePage(+id.slice(1));
  side.querySelectorAll('[data-go]').forEach(b => b.removeAttribute('aria-current'));
  const cur = side.querySelector(`[data-go="${id}"]`); if (cur) cur.setAttribute('aria-current', 'page');
  if (location.hash.slice(1) !== id) setHash('#' + id);
  document.body.classList.remove('menu-open');
  window.scrollTo(0, 0);
  refresh();
}

function refresh(){
  let done = 0;
  FILES.forEach((f, i) => {
    const on = !!state['f' + (i+1)]; if (on) done++;
    const b = side.querySelector(`[data-go="f${i+1}"]`); if (b) b.classList.toggle('is-done', on);
  });
  document.getElementById('meter').style.width = (done / FILES.length * 100) + '%';
  document.getElementById('count').textContent = done === FILES.length ? 'All 16 files created' : `${done} of ${FILES.length} files`;
}

async function copy(text, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  const old = btn.innerHTML;
  btn.innerHTML = ok ? 'Copied' : 'Copy failed: select the code';
  btn.classList.add(ok ? 'ok' : 'x');
  setTimeout(() => { btn.innerHTML = old; btn.classList.remove('ok', 'x'); }, 1500);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) show(b.dataset.go);
  else if (b.dataset.copycode) copy(FILES[+b.dataset.copycode - 1].code, b);
  else if (b.dataset.copypath) copy(FILES[+b.dataset.copypath - 1].path.replace(/^lib\//, ''), b);
  else if (b.dataset.copytext) copy(b.dataset.copytext, b);
  else if (b.id === 'menuBtn') document.body.classList.toggle('menu-open');
});
document.addEventListener('change', e => {
  const cb = e.target.closest('[data-done]'); if (!cb) return;
  state[cb.dataset.done] = cb.checked; save(); refresh();
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

buildSide();
show(location.hash.slice(1));
